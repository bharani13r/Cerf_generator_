
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificate Verification</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Certificate Verification</h1>
  <p>Check whether a digital certificate is listed in the official register.</p>
</header>

<main>
  <section class="card">
    <h2>Verify Certificate</h2>

    <label for="certificateId">Certificate Number</label>
    <input id="certificateId" type="text" placeholder="Enter certificate number">

    <button id="verifyBtn">Verify Certificate</button>
    <p id="verifyStatus" class="status" aria-live="polite"></p>
    <div id="certificateDetails"></div>

    <p><a href="index.html">Back to Certificate Generator</a></p>
  </section>
</main>

<footer>Digital Certificate Verification</footer>

<script>
"use strict";

const idInput = document.getElementById("certificateId");
const statusBox = document.getElementById("verifyStatus");
const details = document.getElementById("certificateDetails");

function showStatus(message, error = false) {
  statusBox.textContent = message;
  statusBox.classList.toggle("error", error);
}

async function verifyCertificate() {
  const id = idInput.value.trim();
  details.replaceChildren();

  if (!id) {
    showStatus("Enter a certificate number.", true);
    return;
  }

  showStatus("Checking certificate register...");

  try {
    const response = await fetch("./certificates.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Could not load the certificate register.");
    }

    const data = await response.json();
    const certificates = Array.isArray(data)
      ? data
      : data.certificates;

    if (!Array.isArray(certificates)) {
      throw new Error("The certificate register has an invalid format.");
    }

    const record = certificates.find(item =>
      String(item.certificateNumber || item.certificateId || "")
        .trim()
        .toLowerCase() === id.toLowerCase()
    );

    if (!record) {
      showStatus("NOT VERIFIED — No matching certificate was found.", true);
      return;
    }

    showStatus("VERIFIED — Certificate found in the register.");

    const table = document.createElement("table");
    const tbody = document.createElement("tbody");

    const fields = [
      ["Certificate Number", record.certificateNumber || record.certificateId],
      ["Serial No.", record.serialNo],
      ["Name", record.name],
      ["Event", record.event],
      ["Date", record.date],
      ["Position", record.position],
      ["Certificate Type", record.certificateType || record.type]
    ];

    fields.forEach(([label, value]) => {
      if (value === undefined || value === null || value === "") return;

      const row = document.createElement("tr");
      const heading = document.createElement("th");
      const cell = document.createElement("td");

      heading.textContent = label;
      cell.textContent = String(value);

      row.append(heading, cell);
      tbody.appendChild(row);
    });

    table.appendChild(tbody);
    details.appendChild(table);
  } catch (error) {
    showStatus(
      error.message + " Make sure certificates.json is published beside this page.",
      true
    );
  }
}

document.getElementById("verifyBtn")
  .addEventListener("click", verifyCertificate);

idInput.addEventListener("keydown", event => {
  if (event.key === "Enter") verifyCertificate();
});

// Automatically verify an ID supplied by the QR-code link.
const params = new URLSearchParams(window.location.search);
const suppliedId = params.get("id");

if (suppliedId) {
  idInput.value = suppliedId;
  verifyCertificate();
}
</script>
</body>
</html>
